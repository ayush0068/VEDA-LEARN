      content="VedaLearn, Veda Learn, learn Vedic courses online, Vedic astrology course, Vastu Shastra course, Bhagavad Gita course, mantra science, yoga and meditation, Ayurveda, Sanatan Dharma, live Vedic classes"

    <meta name="application-name" content="VedaLearn" />

    <link rel="canonical" href="https://learn-veda.vercel.app/" />
    <meta name="theme-color" content="#FBF1DD" />

    <!-- Open Graph / WhatsApp / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />

    <meta property="og:locale" content="en_IN" />

    <meta property="og:image:alt" content="VedaLearn - Ancient Wisdom. Online, For You." />

    <!-- Twitter Card -->

    <meta name="twitter:title" content="VedaLearn | Ancient Wisdom. Online, For You." />
    <meta
      name="twitter:description"
      content="Explore authentic Vedic courses, attend live classes, and learn ancient Indian wisdom from experienced teachers."
    />
    <meta name="twitter:image" content="https://learn-veda.vercel.app/og-image.jpg" />

    <!-- Structured data: tells Google the site name ("VedaLearn" / "Veda Learn") and that the site has a course search -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://learn-veda.vercel.app/#website",
            "url": "https://learn-veda.vercel.app/",
            "name": "VedaLearn",
            "alternateName": ["Veda Learn", "VedaLearn Online", "Learn Veda"],
            "description": "Learn authentic Vedic courses online and attend live classes with experienced teachers.",
            "inLanguage": "en-IN",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://learn-veda.vercel.app/courses?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "EducationalOrganization",
            "@id": "https://learn-veda.vercel.app/#organization",
            "name": "VedaLearn",
            "alternateName": "Veda Learn",
            "url": "https://learn-veda.vercel.app/",
            "logo": "https://learn-veda.vercel.app/favicon.svg",
            "slogan": "Ancient Wisdom. Online, For You."
          }
        ]
      }
    </script>

    <!-- starts downloading the home banner right away (it is the biggest picture on the first screen) -->
    <link rel="preload" as="image" href="/images/Home-banner.png" fetchpriority="high" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif+Devanagari:wght@600;700&family=Playfair+Display:wght@500;600;700&display=swap"
